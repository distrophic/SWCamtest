name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: System libraries for Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 libfontconfig1
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest==8.3.4 pytest-qt==4.4.0 numpy==1.26.4 opencv-python-headless==4.10.0.84 PyQt6==6.7.1 SQLAlchemy==2.0.36 bcrypt==4.2.1 colorlog==6.9.0 python-dotenv==1.0.1
      - name: Run tests
        run: pytest
